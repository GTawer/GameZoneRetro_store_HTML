<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #f0f0f0;">
    <!-- Cor de fundo definida no body -->
    
    <h1 style="color: #0066cc;">Trabalhando com Imagens e Cores<h1>

    <!-- Cores e elementos do texto -->
    <p style="color: red;">Este é um parágrafo em vermelho.</p>
    <p style="color: #00ff00;">Este é um parágrafo em verde (hexadecimal).</p>
    <p style=""color: rgb(0, 0, 255);">Este é um parágrafo em azul (RGB).</p>
    <hr>

    <!-- Imagens como elementos da página -->
     <h2>Imagens</h2>
     <img src="Senai.png" alt="Logo do SENAI" width="200" height="100">
     <img src="Itaú.jpg" alt="Banner promocional" maxwidth: 100%>
     <hr>

     <!-- Imagem com o link -->
      <h2>Imagem com link</h2>
      <p>
        <a href="https://www.google.com" target="_blank">
            <img src="google.jpg" alt="Clique aqui" width="150" height="50">
        </a>
      </p>
     <hr>
     <!-- Elementos com cores no fundo -->
     <div style="background-color: yellow; padding: 10px;">
        <p>Conteúdo com fundo amarelo</p>
     </div>
</body>
</html>
