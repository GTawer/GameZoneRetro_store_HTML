<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
</head>
<body>
    <h1>Trabalhando com Tabelas</h1>
    <hr>

    <!-- Tabela básica para criação de tabelas -->
     <h2>Tabela de Produtos</h2>
     <table border="1">
        <!-- Cabeçalho da tabela -->
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Estoque</th>
            </tr>
        </thead>
        <!-- Corpo da tabela -->
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>R$ 2.500,00</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>R$ 50,00</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Teclado</td>
                <td>R$ 120,00</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>

    <!-- Tabela com mesclagem de células -->
    <h2>Tabela com Mesclagem de Células</h2>
    <table border="1" cellspacing="0" cellpadding="10">
        
            <tr>
                <th colspan="2">Vendas por trimestre</th>
            </tr>
            <tr>
                <td>1° Trimestre</td>
                <td>R$ 50.000</td>
            </tr>
            <tr>
                <td>2° Trimestre</td>
                <td>R$ 65.000</td>
            </tr>
            <tr>
                <td>Total Semestre</td>
                <td>R$ 115.000</td>
        </tbody>
    </table>
</body>
</html>
